<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Shop</title>
   
</head>
<body>
    <main>
        <h1>Juice Shop</h1>
        <p>Sign in or create an account to continue.</p>

        <div class="forms">
            <form id="login-form">
                <h2>Log in</h2>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>

                <button type="submit">Log in</button>
                <p id="message" role="alert"></p>
            </form>

            <form id="signup-form">
                <h2>Sign up</h2>
                <label for="signup-email">Email</label>
                <input id="signup-email" name="email" type="email" required>

                <label for="signup-password">Password</label>
                <input id="signup-password" name="password" type="password" minlength="8" required>

                <label for="signup-password-repeat">Repeat password</label>
                <input id="signup-password-repeat" name="password-repeat" type="password" minlength="8" required>

                <button type="submit">Create account</button>
                <p id="signup-message" role="alert"></p>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="signup.js"></script>
</body>
</html>
